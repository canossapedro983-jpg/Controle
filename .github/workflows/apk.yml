name: Gerar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: gradle assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ControleGastos.apk
      - uses: actions/upload-artifact@v4
        with: {name: ControleGastos-apk, path: ControleGastos.apk}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Controle de gastos (última versão)
          make_latest: true
          files: ControleGastos.apk
