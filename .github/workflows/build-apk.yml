name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - run: unzip ControleDeGastos_pronto_para_compilar.zip

      - run: gradle assembleDebug
        working-directory: ControleDeGastos

      - uses: actions/upload-artifact@v4
        with:
          name: ControleDeGastos-APK
          path: ControleDeGastos/app/build/outputs/apk/debug/app-debug.apk
